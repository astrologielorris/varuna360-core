<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
<!-- SPEC-BAR-001 action-bar glyph, extracted VERBATIM from the binding mockup
     proprietary_docs/spec_design/action_bar_v2/vibrancy_segmented.html <symbol id="i-transit">.
     Ink is currentColor: paint_controls substitutes the state foreground before
     handing the bytes to QSvgRenderer (per-path opacity survives, which SourceIn
     tinting would also preserve but attribute substitution keeps cheaper).
     Do not redraw by hand - regenerate from the mockup if the design moves. -->
  <circle cx="8" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <ellipse cx="8" cy="8" rx="6.6" ry="3" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".75" transform="rotate(-24 8 8)"/>
  <circle cx="13.1" cy="5.9" r="1.35" fill="currentColor"/>
</svg>
